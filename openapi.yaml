openapi: 3.1.0
info:
  title: Landing page API
  version: 1.0.0
  description: Landing page v3 API
components:
  schemas:
    # Enums
    AdminAuth:
      type: string
      enum: [CONFIRMATION, OTP]
      description: Admin authentication method

    VerificationType:
      type: string
      enum: [CONFIRMATION_AUTH, OTP_AUTH, OTP_ACTION]
      description: Type of verification

    TechType:
      type: string
      enum: [BACKEND, FRONTEND, FULL_STACK, DATABASE, STATIC, UNKNOWN]
      description: Technology type

    # Base Models
    ProfileBase:
      type: object
      required: [id, name, bio, avatarUrl]
      properties:
        id: { type: string }
        name: { type: string }
        bio: { type: string }
        avatarUrl: { type: string }
        location: { oneOf: [{ type: string }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminBase:
      type: object
      required: [id, email, name, profileId]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        profileId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        auth: { $ref: "#/components/schemas/AdminAuth" }
        allowEmail: { type: string, format: date-time }

    ProjectBase:
      type: object
      required: [id, title, description, profileId]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        profileId: { type: string }
        repoUrl: { oneOf: [{ type: string }, { type: "null" }] }
        demoUrl: { oneOf: [{ type: string }, { type: "null" }] }
        thumbnail: { oneOf: [{ type: string }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        isRecycled: { type: boolean, default: false }
        deleteAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        techStack: { type: array, items: { $ref: "#/components/schemas/Tech" } }

    TechBase:
      type: object
      required: [id, name, type, projectId]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/TechType" }
        projectId: { type: string }
        url: { type: string }
        isRecycled: { type: boolean, default: false }
        deleteAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }

    SocialBase:
      type: object
      required: [id, provider, url, profileId]
      properties:
        id: { type: string }
        provider: { type: string }
        url: { type: string }
        profileId: { type: string }
        isRecycled: { type: boolean, default: false }
        deleteAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }

    VerificationBase:
      type: object
      required: [id, type, secret, expires, profileId]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/VerificationType" }
        secret: { type: string }
        expires: { type: string, format: date-time }
        profileId: { type: string }
        used: { type: boolean, default: false }

    # Models
    Profile:
      type: object
      required: [id, name, bio, avatarUrl]
      allOf:
        - $ref: "#/components/schemas/ProfileBase"
        - type: object
          properties:
            admins:
              type: array
              items:
                $ref: "#/components/schemas/Admin"
            projects:
              type: array
              items:
                $ref: "#/components/schemas/Project"
            verifications:
              type: array
              items:
                $ref: "#/components/schemas/Verification"
            socials:
              type: array
              items:
                $ref: "#/components/schemas/Social"

    Admin:
      type: object
      required: [id, email, password, name, profileId]
      allOf:
        - $ref: "#/components/schemas/AdminBase"
        - type: object
          properties:
            profile: { $ref: "#/components/schemas/Profile" }

    Project:
      type: object
      required: [id, title, description, profileId]
      allOf:
        - $ref: "#/components/schemas/ProjectBase"
        - type: object
          properties:
            profile: { $ref: "#/components/schemas/Profile" }

    Tech:
      type: object
      required: [id, name, type, projectId]
      allOf:
        - $ref: "#/components/schemas/TechBase"
        - type: object
          properties:
            project: { $ref: "#/components/schemas/Project" }

    Social:
      type: object
      required: [id, provider, url, profileId]
      allOf:
        - $ref: "#/components/schemas/SocialBase"
        - type: object
          properties:
            profile: { $ref: "#/components/schemas/Profile" }

    Verification:
      type: object
      required: [id, type, secret, expires, profileId]
      allOf:
        - $ref: "#/components/schemas/VerificationBase"
        - type: object
          properties:
            profile: { $ref: "#/components/schemas/Profile" }

    # Response
    ResponseEnvelope:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [SUCCESS, ERROR] }
            hasNext: { oneOf: [{ type: boolean }, { type: "null" }] }
            nextOffset: { oneOf: [{ type: integer }, { type: "null" }] }
            information: { oneOf: [{ type: string }, { type: "null" }] }
        data: { type: object }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Follow server CodeError type in normal type }
        message: { type: string }
        title: { oneOf: [{ type: string }, { type: "null" }] }
        details: { oneOf: [{ type: string }, { type: "null" }] }
        field: { oneOf: [{ type: string }, { type: "null" }], description: Follow Fields type in normal type }

    ErrorResponseEnvelope:
      type: object
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/ErrorResponse" } }

    # Body Type
    ProfileBody:
      type: object
      required: [name, bio, avatarUrl]
      properties:
        name: { type: string }
        bio: { type: string }
        avatarUrl: { type: string }
        location: { oneOf: [{ type: string }, { type: "null" }] }
paths:
  /profile:
    get:
      summary: Get profile
      responses:
        200:
          description: Get 1 and only profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProfileBase" }
        500:
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseEnvelope" }
    post:
      summary: Create profile (only 1 on app)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileBody" }
      responses:
        201:
          description: Created 1 and only profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProfileBase" }
        500:
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseEnvelope" }
  /profile/{id}:
    put:
      summary: Update profile
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileBody" }
      responses:
        200:
          description: Update 1 and only profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProfileBase" }
        500:
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseEnvelope" }
    delete:
      summary: Delete profile ⚠️NOT RECOMMENDED
      parameters:
        - name: token
          in: query
          schema: { type: string }
      responses:
        200:
          description: Deleted 1 and only profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProfileBase" }
        500:
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponseEnvelope" }
